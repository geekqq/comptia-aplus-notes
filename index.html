<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Certification Exam Prep & Practice System | CompTIA & Cisco</title>
  <!-- Google AdSense 预留插槽：审核通过后取消下一行注释并替换 client ID -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #ecfdf5;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); padding: 18px 14px; line-height: 1.5; min-height: 100vh; }
    .container { max-width: 880px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
    .logo-area h1 { font-size: 1.3rem; font-weight: 700; color: #0f172a; }
    .controls-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

    /* 科目选择器 */
    .exam-select { padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 0.9rem; font-weight: 600; color: #1e293b; background: #fff; cursor: pointer; outline: none; }
    .exam-select:focus { border-color: var(--primary); }

    .nav-grid { display: flex; flex-wrap: wrap; gap: 6px; background: #fff; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; max-height: 130px; overflow-y: auto; }
    .nav-btn { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .nav-btn:hover { border-color: var(--primary); }
    .nav-btn.current { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .nav-btn.correct { background: var(--success); color: #fff; border-color: var(--success); }
    .nav-btn.wrong { background: var(--danger); color: #fff; border-color: var(--danger); }

    .quiz-card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 26px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 18px; }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .q-tag { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #e0f2fe; color: #0369a1; text-transform: uppercase; }
    .q-tag.multi { background: #fef3c7; color: #92400e; }
    .star-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #cbd5e1; }
    .star-btn.starred { color: #f59e0b; }

    .q-title { font-size: 1.1rem; font-weight: 600; color: #0f172a; line-height: 1.6; margin-bottom: 22px; white-space: pre-wrap; }

    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .option-item { display: flex; align-items: flex-start; padding: 13px 16px; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 0.96rem; transition: 0.15s; user-select: none; }
    .option-item:hover:not(.disabled) { background: #f8fafc; border-color: #94a3b8; }
    .option-item input { margin-top: 3px; margin-right: 14px; width: 18px; height: 18px; accent-color: var(--primary); }
    .option-item span { flex: 1; line-height: 1.5; }

    .option-item.correct-ans { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; font-weight: 600; }
    .option-item.user-wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #7f1d1d; }

    .action-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.15s; background: #fff; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-lang { background: #eff6ff; color: var(--primary); border-color: #bfdbfe; }
    .btn-outline:hover { background: #f1f5f9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .feedback-box { margin-top: 22px; padding: 18px; border-radius: var(--radius); display: none; line-height: 1.6; }
    .feedback-box.correct { display: block; background: var(--success-bg); border-left: 5px solid var(--success); }
    .feedback-box.wrong { display: block; background: var(--danger-bg); border-left: 5px solid var(--danger); }
    .fb-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; }
    .fb-title.correct { color: var(--success); }
    .fb-title.wrong { color: var(--danger); }
    .exp-content { margin-top: 10px; font-size: 0.94rem; color: #334155; white-space: pre-wrap; }
    .mnemonic-box { margin-top: 12px; padding: 10px 14px; background: #fff; border-radius: 8px; border: 1px dashed #cbd5e1; font-size: 0.9rem; color: #0284c7; }

    /* 商业化：Google Ads 预留广告位容器 */
    .ad-banner-slot { width: 100%; min-height: 80px; background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 20px 0; color: #94a3b8; font-size: 0.82rem; }

    /* 弹窗样式 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-box { background: #fff; border-radius: var(--radius); max-width: 620px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-box h2 { font-size: 1.2rem; margin-bottom: 12px; }
    .tab-bar { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 16px; gap: 8px; }
    .tab-btn { background: none; border: none; padding: 8px 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-area">
      <h1 id="appTitle">IT 认证刷题特训平台</h1>
      <p style="font-size:0.83rem; color:var(--text-muted); margin-top:2px;" id="appSubtitle">多科目支持 | 高频错题深度解析</p>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-lang" id="langToggleBtn" onclick="toggleLanguage()">🌐 English</button>
      <button class="btn btn-outline" id="addBtnLabel" onclick="openAddModal()">➕ 添加错题</button>
    </div>
  </header>

  <!-- 科目选择 & 状态条 -->
  <div class="controls-bar">
    <select class="exam-select" id="examSelector" onchange="switchExam(this.value)">
      <option value="core2">CompTIA A+ Core 2 (220-1102)</option>
      <option value="core1">CompTIA A+ Core 1 (220-1101) [待加载]</option>
      <option value="secplus">CompTIA Security+ (SY0-701) [筹备中]</option>
      <option value="netplus">CompTIA Network+ (N10-009) [筹备中]</option>
      <option value="linuxplus">CompTIA Linux+ (XK0-005) [筹备中]</option>
      <option value="ccna">Cisco CCNA (200-301) [筹备中]</option>
    </select>
    <div class="stats-summary" id="statsSummary" style="font-size:0.9rem; font-weight:600; color:var(--primary); margin-left:auto;">加载中...</div>
  </div>

  <!-- 答题卡网格 -->
  <div class="nav-grid" id="navGrid"></div>

  <!-- 做题卡片 -->
  <div class="quiz-card">
    <div class="q-meta">
      <span class="q-tag" id="qTag">单选</span>
      <div>
        <span style="font-size:0.85rem; color:var(--text-muted); margin-right:8px;" id="qIndexLabel">Q1</span>
        <button class="star-btn" id="starBtn" onclick="toggleCurrentStar()">★</button>
      </div>
    </div>

    <div class="q-title" id="qTitle">正在从题库加载题目...</div>
    <div class="options" id="optionsContainer"></div>

    <div class="action-bar">
      <div>
        <button class="btn btn-outline" id="prevBtn" onclick="navigate(-1)">上一题</button>
        <button class="btn btn-outline" id="nextBtn" onclick="navigate(1)">下一题</button>
      </div>
      <button class="btn btn-primary" id="submitBtn" onclick="handleCommit()">提交选择</button>
    </div>

    <!-- 考点解析 -->
    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title" id="fbTitle"></div>
      <div><strong id="correctLabelPrefix">标准正确答案：</strong><span id="correctKey"></span></div>
      <div class="exp-content" id="expContent"></div>
      <div class="mnemonic-box" id="mnemonicBox"></div>
    </div>
  </div>

  <!-- 商业化：底部 Google AdSense 预留插槽 -->
  <div class="ad-banner-slot">
    <span>Advertisement / 赞助广告展示位</span>
    <span style="font-size:0.75rem;">(Google AdSense Banner Slot 728x90 / Responsive)</span>
  </div>
</div>

<!-- 添加错题模态框 -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <h2>➕ 添加新错题到当前科目</h2>
    <div class="tab-bar">
      <button class="tab-btn active" id="tabPasteBtn" onclick="switchTab('paste')">⚡ 极速代码粘贴导入 (推荐)</button>
      <button class="tab-btn" id="tabFormBtn" onclick="switchTab('form')">✍️ 手动逐步填写</button>
    </div>

    <div id="tabPasteContent">
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">
        直接将生成的 <code>{ id: ..., stem: ..., ... }</code> 代码粘贴在下方：
      </p>
      <div class="form-group">
        <textarea id="rawCodeInput" rows="10" placeholder="粘贴整段代码..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
        <button class="btn btn-primary" onclick="importFromRawCode()">🚀 极速导入</button>
      </div>
    </div>

    <div id="tabFormContent" style="display:none;">
      <div class="form-group"><label>题型</label><select id="newType"><option value="single">单选题</option><option value="multiple">多选题</option></select></div>
      <div class="form-group"><label>题干</label><textarea id="newStem" rows="3"></textarea></div>
      <div class="form-group"><label>选项 (每行一个，如 A. 选项)</label><textarea id="newOptions" rows="4"></textarea></div>
      <div class="form-group"><label>正确答案 (如 B 或 A,C)</label><input type="text" id="newAnswer"></div>
      <div class="form-group"><label>解析</label><textarea id="newExp" rows="3"></textarea></div>
      <div class="form-group"><label>口诀 (选填)</label><input type="text" id="newMnemonic"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
        <button class="btn btn-primary" onclick="saveNewQuestion()">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentLang = localStorage.getItem('it_drill_lang') || 'zh';
  let currentExam = localStorage.getItem('it_drill_exam') || 'core2';

  const EXAM_CONFIG = {
    core2: { name: "CompTIA A+ Core 2", file: "./questions.json" },
    core1: { name: "CompTIA A+ Core 1", file: "./core1.json" },
    secplus: { name: "CompTIA Security+", file: "./secplus.json" },
    netplus: { name: "CompTIA Network+", file: "./netplus.json" },
    linuxplus: { name: "CompTIA Linux+", file: "./linuxplus.json" },
    ccna: { name: "Cisco CCNA", file: "./ccna.json" }
  };

  const i18n = {
    zh: {
      appTitle: "IT 认证刷题特训平台",
      appSubtitle: "多科目支持 | 高频错题深度解析",
      langBtn: "🌐 English",
      addBtn: "➕ 添加错题",
      single: "单选题",
      multi: "多选题（选 {n} 项）",
      qOf: "第 {curr} 题 / 共 {total} 题",
      prev: "上一题",
      next: "下一题",
      submit: "提交选择",
      submitted: "已提交评估",
      correctTitle: "🎉 回答完全正确！",
      wrongTitle: "❌ 回答错误！请复盘解析",
      correctAns: "标准正确答案：",
      tipPrefix: "💡 核心考点与记忆口诀：",
      alertSelect: "请先勾选你的选项！",
      statAnswered: "已答: {ans} / {total} | 正确: {cor} | 正确率: {acc}%"
    },
    en: {
      appTitle: "IT Certification Exam Prep & Practice",
      appSubtitle: "Multi-Exam Drill | In-Depth Scenario Explanations",
      langBtn: "🌐 中文版",
      addBtn: "➕ Add Question",
      single: "Single Choice",
      multi: "Multiple Choice (Select {n})",
      qOf: "Question {curr} of {total}",
      prev: "Previous",
      next: "Next",
      submit: "Submit Selection",
      submitted: "Submitted",
      correctTitle: "🎉 Correct! Well done.",
      wrongTitle: "❌ Incorrect. Review explanation below.",
      correctAns: "Correct Answer: ",
      tipPrefix: "💡 Exam Tip & Mnemonic: ",
      alertSelect: "Please select an answer before submitting!",
      statAnswered: "Answered: {ans} / {total} | Correct: {cor} | Accuracy: {acc}%"
    }
  };

  let questions = [];
  let currentIdx = 0;
  let userSelections = {}; 
  let submittedStatus = {};
  let starredSet = new Set();

  // 初始化加载当前科目题库
  async function loadExamData(examKey) {
    document.getElementById('qTitle').innerText = '正在载入题库数据...';
    userSelections = {};
    submittedStatus = {};
    currentIdx = 0;
    starredSet = new Set(JSON.parse(localStorage.getItem(`stars_${examKey}`) || '[]'));

    try {
      const res = await fetch(EXAM_CONFIG[examKey].file);
      if (!res.ok) throw new Error('File not found');
      const data = await res.json();
      
      // 合并本地为该科目追加的自定义题目
      const custom = JSON.parse(localStorage.getItem(`custom_${examKey}`) || '[]');
      questions = [...data, ...custom];
    } catch (e) {
      // 容错：如果该科目文件尚未建立
      const custom = JSON.parse(localStorage.getItem(`custom_${examKey}`) || '[]');
      if (custom.length > 0) {
        questions = custom;
      } else {
        questions = [{
          id: 9999, type: "single",
          stem: { zh: `【${EXAM_CONFIG[examKey].name}】题库正在编纂整理中，敬请期待！`, en: `The question bank for ${EXAM_CONFIG[examKey].name} is currently under preparation.` },
          options: [{ key: "A", text: "期待上线 / Stay tuned" }],
          answer: ["A"],
          explanation: { zh: "你可以点击右上角【➕ 添加错题】直接为该科目录入你自己的题目！", en: "You can click '+ Add Question' to start importing your own questions for this exam!" },
          mnemonic: "持续扩充，逢考必过！"
        }];
      }
    }

    initNavGrid();
    renderUI();
  }

  function switchExam(examKey) {
    currentExam = examKey;
    localStorage.setItem('it_drill_exam', examKey);
    loadExamData(examKey);
  }

  function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('it_drill_lang', currentLang);
    renderUI();
  }

  function initNavGrid() {
    const grid = document.getElementById('navGrid');
    grid.innerHTML = '';
    questions.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = `nav-btn ${i === currentIdx ? 'current' : ''}`;
      btn.id = `nav-${i}`;
      btn.innerText = i + 1;
      btn.onclick = () => jumpTo(i);
      grid.appendChild(btn);
    });
  }

  function updateStats() {
    let answered = Object.keys(submittedStatus).length;
    let correctCount = 0;
    Object.keys(submittedStatus).forEach(idx => {
      const q = questions[idx];
      const sel = userSelections[idx] || [];
      if (isEqual(sel, q.answer)) correctCount++;
    });
    const acc = answered === 0 ? 0 : Math.round((correctCount / answered) * 100);
    const text = i18n[currentLang].statAnswered
      .replace('{ans}', answered)
      .replace('{total}', questions.length)
      .replace('{cor}', correctCount)
      .replace('{acc}', acc);
    document.getElementById('statsSummary').innerText = text;
  }

  function renderUI() {
    const t = i18n[currentLang];
    document.getElementById('appTitle').innerText = t.appTitle;
    document.getElementById('appSubtitle').innerText = t.appSubtitle;
    document.getElementById('langToggleBtn').innerText = t.langBtn;
    document.getElementById('addBtnLabel').innerText = t.addBtn;
    document.getElementById('prevBtn').innerText = t.prev;
    document.getElementById('nextBtn').innerText = t.next;
    document.getElementById('correctLabelPrefix').innerText = t.correctAns;
    document.getElementById('examSelector').value = currentExam;
    renderQuiz();
  }

  function renderQuiz() {
    if (!questions || questions.length === 0) return;
    const q = questions[currentIdx];
    const t = i18n[currentLang];

    document.getElementById('qIndexLabel').innerText = t.qOf
      .replace('{curr}', currentIdx + 1)
      .replace('{total}', questions.length);

    if (q.type === 'multiple') {
      const count = q.selectLimit || q.answer.length;
      document.getElementById('qTag').innerText = t.multi.replace('{n}', count);
      document.getElementById('qTag').className = 'q-tag multi';
    } else {
      document.getElementById('qTag').innerText = t.single;
      document.getElementById('qTag').className = 'q-tag';
    }

    const stemText = (typeof q.stem === 'object') ? (q.stem[currentLang] || q.stem.zh || q.stem.en) : q.stem;
    document.getElementById('qTitle').innerText = stemText;

    const starBtn = document.getElementById('starBtn');
    starBtn.className = `star-btn ${starredSet.has(q.id) ? 'starred' : ''}`;

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    const isSubmitted = submittedStatus[currentIdx];
    const currentSelected = userSelections[currentIdx] || [];

    q.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = `option-item ${isSubmitted ? 'disabled' : ''}`;

      const input = document.createElement('input');
      input.type = q.type === 'multiple' ? 'checkbox' : 'radio';
      input.name = `opt_${q.id}`;
      input.value = opt.key;
      input.checked = currentSelected.includes(opt.key);
      input.disabled = isSubmitted;

      input.onchange = () => {
        if (q.type === 'multiple') {
          const checked = Array.from(container.querySelectorAll('input:checked')).map(el => el.value);
          userSelections[currentIdx] = checked;
        } else {
          userSelections[currentIdx] = [opt.key];
        }
      };

      if (isSubmitted) {
        if (q.answer.includes(opt.key)) {
          label.classList.add('correct-ans');
        } else if (currentSelected.includes(opt.key)) {
          label.classList.add('user-wrong');
        }
      }

      label.appendChild(input);
      const span = document.createElement('span');
      const optText = (typeof opt.text === 'object') ? (opt.text[currentLang] || opt.text.zh || opt.text.en) : opt.text;
      span.innerText = `${opt.key}. ${optText.replace(/^[A-E]\.\s*/i, '')}`;
      label.appendChild(span);
      container.appendChild(label);
    });

    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').disabled = currentIdx === questions.length - 1;

    const submitBtn = document.getElementById('submitBtn');
    const feedbackBox = document.getElementById('feedbackBox');
    const fbTitle = document.getElementById('fbTitle');

    if (isSubmitted) {
      submitBtn.disabled = true;
      submitBtn.innerText = t.submitted;

      const isCorrect = isEqual(currentSelected, q.answer);
      feedbackBox.className = `feedback-box ${isCorrect ? 'correct' : 'wrong'}`;
      fbTitle.className = `fb-title ${isCorrect ? 'correct' : 'wrong'}`;
      fbTitle.innerText = isCorrect ? t.correctTitle : t.wrongTitle;
      document.getElementById('correctKey').innerText = q.answer.join(', ');

      const expText = (typeof q.explanation === 'object') ? (q.explanation[currentLang] || q.explanation.zh || q.explanation.en) : q.explanation;
      document.getElementById('expContent').innerText = expText;

      const mnemonicEl = document.getElementById('mnemonicBox');
      if (q.mnemonic) {
        mnemonicEl.innerText = `${t.tipPrefix} ${q.mnemonic}`;
        mnemonicEl.style.display = 'block';
      } else {
        mnemonicEl.style.display = 'none';
      }

      feedbackBox.style.display = 'block';
    } else {
      submitBtn.disabled = false;
      submitBtn.innerText = t.submit;
      feedbackBox.style.display = 'none';
    }

    document.querySelectorAll('.nav-btn').forEach((btn, i) => {
      btn.classList.remove('current');
      if (i === currentIdx) btn.classList.add('current');
    });

    updateStats();
  }

  function isEqual(arr1, arr2) {
    if (!arr1 || !arr2 || arr1.length !== arr2.length) return false;
    return [...arr1].sort().join('') === [...arr2].sort().join('');
  }

  function handleCommit() {
    const q = questions[currentIdx];
    const selected = userSelections[currentIdx];
    if (!selected || selected.length === 0) {
      alert(i18n[currentLang].alertSelect);
      return;
    }

    submittedStatus[currentIdx] = true;
    const isCorrect = isEqual(selected, q.answer);
    const navBtn = document.getElementById(`nav-${currentIdx}`);
    if (navBtn) {
      navBtn.classList.add(isCorrect ? 'correct' : 'wrong');
    }

    renderQuiz();
  }

  function navigate(delta) {
    const target = currentIdx + delta;
    if (target >= 0 && target < questions.length) {
      currentIdx = target;
      renderQuiz();
    }
  }

  function jumpTo(idx) {
    currentIdx = idx;
    renderQuiz();
  }

  function toggleCurrentStar() {
    const q = questions[currentIdx];
    if (starredSet.has(q.id)) {
      starredSet.delete(q.id);
    } else {
      starredSet.add(q.id);
    }
    localStorage.setItem(`stars_${currentExam}`, JSON.stringify([...starredSet]));
    renderQuiz();
  }

  function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
  function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

  function switchTab(type) {
    const isPaste = type === 'paste';
    document.getElementById('tabPasteBtn').className = `tab-btn ${isPaste ? 'active' : ''}`;
    document.getElementById('tabFormBtn').className = `tab-btn ${!isPaste ? 'active' : ''}`;
    document.getElementById('tabPasteContent').style.display = isPaste ? 'block' : 'none';
    document.getElementById('tabFormContent').style.display = !isPaste ? 'block' : 'none';
  }

  function importFromRawCode() {
    const raw = document.getElementById('rawCodeInput').value.trim();
    if (!raw) return alert('请先粘贴代码！');
    try {
      let parsed;
      try { parsed = JSON.parse(raw); } catch(e) { parsed = (new Function(`return (${raw});`))(); }
      if (!parsed || !parsed.stem || !parsed.options || !parsed.answer) throw new Error('缺少必要字段');

      parsed.id = parsed.id || Date.now();
      const customKey = `custom_${currentExam}`;
      let custom = JSON.parse(localStorage.getItem(customKey) || '[]');
      custom.push(parsed);
      localStorage.setItem(customKey, JSON.stringify(custom));
      questions.push(parsed);

      document.getElementById('rawCodeInput').value = '';
      closeAddModal();
      initNavGrid();
      jumpTo(questions.length - 1);
      alert('🎉 题目已添加到当前科目题库！');
    } catch(err) {
      alert('解析失败：' + err.message);
    }
  }

  function saveNewQuestion() {
    const stem = document.getElementById('newStem').value.trim();
    const type = document.getElementById('newType').value;
    const optText = document.getElementById('newOptions').value.trim();
    const ansText = document.getElementById('newAnswer').value.trim().toUpperCase();
    const exp = document.getElementById('newExp').value.trim();
    const mnemonic = document.getElementById('newMnemonic').value.trim();

    if (!stem || !optText || !ansText) return alert('请完整填写题干、选项和答案！');

    const lines = optText.split('\n').filter(l => l.trim().length > 0);
    const options = lines.map((l, i) => {
      const match = l.match(/^([A-Ea-e])[\.\:\、\s]/);
      const key = match ? match[1].toUpperCase() : String.fromCharCode(65 + i);
      return { key, text: l.trim() };
    });

    const newQ = {
      id: Date.now(),
      type,
      stem: { zh: stem, en: stem },
      options,
      answer: ansText.replace(/[^A-E]/g, '').split(''),
      explanation: { zh: exp || '暂无解析', en: exp || 'No explanation' },
      mnemonic: mnemonic
    };

    const customKey = `custom_${currentExam}`;
    let custom = JSON.parse(localStorage.getItem(customKey) || '[]');
    custom.push(newQ);
    localStorage.setItem(customKey, JSON.stringify(custom));
    questions.push(newQ);

    closeAddModal();
    initNavGrid();
    jumpTo(questions.length - 1);
    alert('新题目添加成功！');
  }

  // 启动
  loadExamData(currentExam);
</script>
</body>
</html>
