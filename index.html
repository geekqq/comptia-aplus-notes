<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompTIA A+ Core 2 (220-1102) Drill System</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #ecfdf5;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px; line-height: 1.5; }
    .container { max-width: 860px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.35rem; font-weight: 700; color: #0f172a; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stats-summary { font-size: 0.92rem; font-weight: 600; color: var(--primary); margin-left: 4px; }

    /* 题号答题卡网格 */
    .nav-grid { display: flex; flex-wrap: wrap; gap: 6px; background: #fff; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; max-height: 140px; overflow-y: auto; }
    .nav-btn { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .nav-btn:hover { border-color: var(--primary); }
    .nav-btn.current { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .nav-btn.correct { background: var(--success); color: #fff; border-color: var(--success); }
    .nav-btn.wrong { background: var(--danger); color: #fff; border-color: var(--danger); }

    /* 主做题卡片 */
    .quiz-card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 28px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .q-tag { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #e0f2fe; color: #0369a1; text-transform: uppercase; }
    .q-tag.multi { background: #fef3c7; color: #92400e; }
    .star-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #cbd5e1; }
    .star-btn.starred { color: #f59e0b; }

    .q-title { font-size: 1.12rem; font-weight: 600; color: #0f172a; line-height: 1.6; margin-bottom: 22px; white-space: pre-wrap; }

    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .option-item {
      display: flex;
      align-items: flex-start;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.98rem;
      transition: all 0.15s ease;
      user-select: none;
    }
    .option-item:hover:not(.disabled) { background: #f8fafc; border-color: #94a3b8; }
    .option-item input { margin-top: 3px; margin-right: 14px; width: 18px; height: 18px; accent-color: var(--primary); }
    .option-item span { flex: 1; line-height: 1.5; }

    /* 判定后的高亮样式 */
    .option-item.correct-ans { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; font-weight: 600; }
    .option-item.user-wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #7f1d1d; }

    .action-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.15s; background: #fff; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-lang { background: #eff6ff; color: var(--primary); border-color: #bfdbfe; }
    .btn-lang:hover { background: #dbeafe; }
    .btn-outline:hover { background: #f1f5f9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 答案与官方考点解析区 */
    .feedback-box { margin-top: 24px; padding: 20px; border-radius: var(--radius); display: none; line-height: 1.6; }
    .feedback-box.correct { display: block; background: var(--success-bg); border-left: 5px solid var(--success); }
    .feedback-box.wrong { display: block; background: var(--danger-bg); border-left: 5px solid var(--danger); }
    .fb-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; }
    .fb-title.correct { color: var(--success); }
    .fb-title.wrong { color: var(--danger); }
    .exp-content { margin-top: 12px; font-size: 0.94rem; color: #334155; white-space: pre-wrap; }
    .mnemonic-box { margin-top: 14px; padding: 10px 14px; background: #fff; border-radius: 8px; border: 1px dashed #cbd5e1; font-size: 0.9rem; color: #0284c7; }

    /* 模态框 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-box { background: #fff; border-radius: var(--radius); max-width: 600px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-box h2 { font-size: 1.2rem; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1 id="appTitle">CompTIA A+ Core 2 错题演练</h1>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;" id="appSubtitle">全量收录自你的 GitHub 错题本 | 支持中英双语</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-lang" id="langToggleBtn" onclick="toggleLanguage()">🌐 English</button>
      <button class="btn btn-outline" id="addBtnLabel" onclick="openAddModal()">➕ 添加新错题</button>
      <div class="stats-summary" id="statsSummary">已答: 0 / 41</div>
    </div>
  </header>

  <!-- 题号答题卡 -->
  <div class="nav-grid" id="navGrid"></div>

  <!-- 题目卡片 -->
  <div class="quiz-card">
    <div class="q-meta">
      <span class="q-tag" id="qTag">单选</span>
      <div>
        <span style="font-size:0.85rem; color:var(--text-muted); margin-right:8px;" id="qIndexLabel">Q1</span>
        <button class="star-btn" id="starBtn" onclick="toggleCurrentStar()">★</button>
      </div>
    </div>

    <div class="q-title" id="qTitle">加载中...</div>

    <div class="options" id="optionsContainer"></div>

    <div class="action-bar">
      <div>
        <button class="btn btn-outline" id="prevBtn" onclick="navigate(-1)">上一题</button>
        <button class="btn btn-outline" id="nextBtn" onclick="navigate(1)">下一题</button>
      </div>
      <button class="btn btn-primary" id="submitBtn" onclick="handleCommit()">提交选择</button>
    </div>

    <!-- 答案解析 -->
    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title" id="fbTitle"></div>
      <div><strong id="correctLabelPrefix">标准正确答案：</strong><span id="correctKey"></span></div>
      <div class="exp-content" id="expContent"></div>
      <div class="mnemonic-box" id="mnemonicBox"></div>
    </div>
  </div>
</div>

<!-- 添加题目模态框 -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <h2 id="modalTitle">➕ 添加新错题</h2>
    <div class="form-group">
      <label id="lblType">题型</label>
      <select id="newType">
        <option value="single">单选题 / Single</option>
        <option value="multiple">多选题 / Multiple</option>
      </select>
    </div>
    <div class="form-group">
      <label id="lblStem">题干 (Question Stem)</label>
      <textarea id="newStem" rows="3" placeholder="输入题目内容..."></textarea>
    </div>
    <div class="form-group">
      <label id="lblOpts">选项 (每行一个，例如 A. 选项内容)</label>
      <textarea id="newOptions" rows="4" placeholder="A. Option 1&#10;B. Option 2&#10;C. Option 3&#10;D. Option 4"></textarea>
    </div>
    <div class="form-group">
      <label id="lblAns">正确答案 (如 B 或 A,C)</label>
      <input type="text" id="newAnswer" placeholder="B 或 A,B,C">
    </div>
    <div class="form-group">
      <label id="lblExp">解析</label>
      <textarea id="newExp" rows="3" placeholder="解析内容..."></textarea>
    </div>
    <div class="form-group">
      <label id="lblMnemonic">记忆口诀 / Exam Tip</label>
      <input type="text" id="newMnemonic" placeholder="记忆口诀...">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
      <button class="btn btn-outline" onclick="closeAddModal()" id="btnCancel">取消</button>
      <button class="btn btn-primary" onclick="saveNewQuestion()" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
  let currentLang = localStorage.getItem('a_plus_lang') || 'zh';

  const i18n = {
    zh: {
      appTitle: "CompTIA A+ Core 2 错题演练",
      appSubtitle: "全量收录自你的 GitHub 错题本 | 支持中英双语",
      langBtn: "🌐 English",
      addBtn: "➕ 添加新错题",
      single: "单选题",
      multi: "多选题（选 {n} 项）",
      qOf: "第 {curr} 题 / 共 {total} 题",
      prev: "上一题",
      next: "下一题",
      submit: "提交选择",
      submitted: "已提交评估",
      correctTitle: "🎉 回答完全正确！",
      wrongTitle: "❌ 回答错误！请复盘解析",
      correctAns: "标准正确答案：",
      tipPrefix: "💡 核心考点与记忆口诀：",
      alertSelect: "请先勾选你的选项！",
      statAnswered: "已答: {ans} / {total} | 正确数: {cor} | 正确率: {acc}%"
    },
    en: {
      appTitle: "CompTIA A+ Core 2 Exam Drill",
      appSubtitle: "Full Question Bank from Your GitHub Notes | Bilingual",
      langBtn: "🌐 中文版",
      addBtn: "➕ Add Question",
      single: "Single Choice",
      multi: "Multiple Choice (Select {n})",
      qOf: "Question {curr} of {total}",
      prev: "Previous",
      next: "Next",
      submit: "Submit Selection",
      submitted: "Submitted",
      correctTitle: "🎉 Correct! Well done.",
      wrongTitle: "❌ Incorrect. Review explanation below.",
      correctAns: "Correct Answer: ",
      tipPrefix: "💡 Exam Tip & Mnemonic: ",
      alertSelect: "Please select an answer before submitting!",
      statAnswered: "Answered: {ans} / {total} | Correct: {cor} | Accuracy: {acc}%"
    }
  };

  // 41 道完整双语题库
  const baseQuestions = [
    {
      id: 1, type: "multiple", selectLimit: 3,
      stem: {
        zh: "关于跨站脚本攻击（XSS, Cross-Site Scripting），以下哪三项描述是正确的？（Select THREE）",
        en: "Which of the following statements regarding Cross-Site Scripting (XSS) are accurate? (Select THREE)"
      },
      options: [
        { key: "A", text: "An attacker injects a malicious script into a trusted website" },
        { key: "B", text: "The attacker’s script is executed in the user’s browser" },
        { key: "C", text: "An attack that exploits the trust a user's web browser has in a website" },
        { key: "D", text: "The trusted website executes an action on behalf of the user without their consent" },
        { key: "E", text: "An attacker captures passwords transmitted across an unencrypted network segment" }
      ],
      answer: ["A", "B", "C"],
      explanation: {
        zh: "【XSS vs CSRF 信任方向】\n- A、B、C 属于典型的 XSS：恶意脚本注入受信任网站并在用户浏览器中执行，利用的是用户对网站的信任。\n- 选项 D 属于 CSRF（跨站请求伪造）：利用网站对已登录用户的信任，伪造请求让网站代为执行操作。",
        en: "XSS involves injecting malicious scripts into trusted websites that execute inside the victim's browser. Exploits the trust a user has in a website. Option D describes CSRF (Cross-Site Request Forgery)."
      },
      mnemonic: "口诀：XSS 脚本浏览器里当场跑；CSRF 冒充你在网站发请求。"
    },
    {
      id: 2, type: "multiple", selectLimit: 3,
      stem: {
        zh: "在网络安全中，关于路径上攻击（On-path attack，曾称中间人攻击 MitM），以下哪三项描述符合其攻击特征？（Select THREE）",
        en: "Which of the following characteristics accurately describe an On-Path Attack (formerly known as Man-in-the-Middle)? (Select THREE)"
      },
      options: [
        { key: "A", text: "Attackers intercept and modify the packets sent between two communicating devices" },
        { key: "B", text: "Attackers can impersonate one of the communicating parties to alter the communication" },
        { key: "C", text: "Attackers place themselves on the communication route between two devices" },
        { key: "D", text: "An on-path attack may succeed only if at least one of the communicating devices has been compromised" },
        { key: "E", text: "Attackers must gain physical access to the target host to execute the attack" }
      ],
      answer: ["A", "B", "C"],
      explanation: {
        zh: "【On-path 特性】攻击者置于通信链路中间，拦截、篡改数据并可冒充双方。不需要任何一台终端被攻破（可通过 ARP 欺骗或虚假 AP 达成），也不需要物理接触物理机。",
        en: "Attackers place themselves between endpoints to intercept, modify, or impersonate traffic. It does NOT require either endpoint to be compromised or physically accessed."
      },
      mnemonic: "口诀：On-path 插中间，偷听篡改加冒充；不用端设备被黑，网络劫持就能做。"
    },
    {
      id: 3, type: "single",
      stem: {
        zh: "攻击者通过伪造发件人电子邮件地址、伪造源 IP 地址或伪造网卡的 MAC 地址，冒充受信任来源，该技术最准确的术语是：",
        en: "An attacker alters headers to forge an email address, IP address, or MAC address to appear as a trusted entity. What is this technique called?"
      },
      options: [
        { key: "A", text: "Impersonation" },
        { key: "B", text: "Spoofing" },
        { key: "C", text: "Privilege Escalation" },
        { key: "D", text: "Phishing" }
      ],
      answer: ["B"],
      explanation: {
        zh: "【Spoofing 欺骗/伪造】伪造具体的网络或系统技术标识（IP/MAC/Email/Caller ID）的标准术语是 Spoofing。Impersonation 偏向人际社工冒充。",
        en: "Spoofing is the specific technical act of falsifying data (such as IP, MAC, or email addresses) to disguise identities. Impersonation refers broadly to mimicking someone socially."
      },
      mnemonic: "口诀：伪造 IP/MAC/Email 标识全叫 Spoofing；假装是同事打工人叫 Impersonation。"
    },
    {
      id: 4, type: "single",
      stem: {
        zh: "安全人员发现了一个针对操作系统内核的攻击代码，而该软件开发商尚未意识到该漏洞的存在，也没有发布任何补丁。这种攻击形式被称为：",
        en: "A newly discovered vulnerability in an OS kernel is being actively exploited before the vendor is even aware or has created a patch. What type of attack is this?"
      },
      options: [
        { key: "A", text: "Backdoor exploit" },
        { key: "B", text: "Zero-day attack" },
        { key: "C", text: "Rootkit deployment" },
        { key: "D", text: "Ransomware injection" }
      ],
      answer: ["B"],
      explanation: {
        zh: "【Zero-day 零日攻击】软件厂商未知、且无已知官方补丁的漏洞利用，被称为零日攻击（Zero-day）。",
        en: "A Zero-Day vulnerability is an unpatched flaw unknown to the software developer, leaving 0 days of defense before exploitation occurs."
      },
      mnemonic: "口诀：厂商未知、补丁未出，就是 Zero-day。"
    },
    {
      id: 5, type: "single",
      stem: {
        zh: "网络犯罪分子专门针对一家大型企业的高级管理人员（如首席执行官 CEO、首席财务官 CFO）发送高度定制化钓鱼邮件。该定向攻击最准确的术语是：",
        en: "A tailored phishing email campaign specifically targets C-level executives (e.g., CEO, CFO) to authorize a high-value wire transfer. What is this attack called?"
      },
      options: [
        { key: "A", text: "Spear phishing" },
        { key: "B", text: "Whaling" },
        { key: "C", text: "Watering hole attack" },
        { key: "D", text: "Vishing" }
      ],
      answer: ["B"],
      explanation: {
        zh: "【Whaling 捕鲸】针对公司高级管理人员（High-profile executives / VIPs）的特定钓鱼，CompTIA 考题标准答案为 Whaling。",
        en: "Whaling is a specialized form of spear phishing directed specifically at high-profile individuals such as CEOs, CFOs, or board members."
      },
      mnemonic: "口诀：钓普通人是 Phishing，普通团队是 Spear，专钓高管大鱼是 Whaling。"
    },
    {
      id: 6, type: "single",
      stem: {
        zh: "某攻击者收集了财务部门具体员工的姓名和业务信息，随后给他们发送了个性化定制的发票查询邮件诱导其输入凭据。这属于以下哪种攻击？",
        en: "An attacker gathers intelligence on employees in the accounting department and sends customized emails containing their names and vendor references to steal credentials. What is this?"
      },
      options: [
        { key: "A", text: "Watering hole attack" },
        { key: "B", text: "Spear phishing" },
        { key: "C", text: "Pharming" },
        { key: "D", text: "Smishing" }
      ],
      answer: ["B"],
      explanation: {
        zh: "【Spear phishing 矛钓】针对特定个人或特定群体的定向定制钓鱼属于 Spear phishing。Watering hole（水坑攻击）是在目标经常访问的网站下毒。",
        en: "Spear phishing targets specific individuals or organizations with customized information rather than random mass emails."
      },
      mnemonic: "口诀：特定目标发定制邮件 = Spear phishing；常去网站下毒 = 水坑攻击。"
    },
    {
      id: 7, type: "single",
      stem: {
        zh: "公司需要为经常携带笔记本电脑在机场、咖啡厅等外部公共网络办公的员工提供单机维度的安全保护，防止其受到外部入站未授权访问。应优先配置：",
        en: "A remote technician travels frequently and connects to public Wi-Fi at coffee shops. What security control should be implemented on the laptop to block unauthorized inbound connections?"
      },
      options: [
        { key: "A", text: "Hardware firewall" },
        { key: "B", text: "Software firewall (Host-based firewall)" },
        { key: "C", text: "UTM appliance" },
        { key: "D", text: "Proxy server" }
      ],
      answer: ["B"],
      explanation: {
        zh: "【主机型防火墙】移动设备离开企业网络后，边界硬件防火墙无法提供保护，必须依赖运行在单机操作系统上的 Software firewall（如 Windows Defender 防火墙）。",
        en: "Host-based (software) firewalls protect individual endpoint devices regardless of which external, untrusted network they connect to."
      },
      mnemonic: "口诀：移动单机出门在外保安全，就靠 Software firewall（主机防火墙）。"
    },
    {
      id: 8, type: "single",
      stem: {
        zh: "企业希望外包安全运营，要求第三方服务商提供 7x24 小时网络威胁监控、主动检测并直接采取实际行动协助遏制和消除安全事件。该服务属于：",
        en: "An organization seeks an outsourced service that provides 24/7 continuous threat monitoring, incident detection, and active hands-on remediation response. What service fits this best?"
      },
      options: [
        { key: "A", text: "MSP (Managed Service Provider)" },
        { key: "B", text: "MDR (Managed Detection and Response)" },
        { key: "C", text: "SIEM" },
        { key: "D", text: "IAM" }
      ],
      answer: ["B"],
      explanation: {
        zh: "【MDR vs MSP】MDR 专注安全监控、威胁检测和实际响应（Response）。MSP 是常规 IT 基础设施外包运维，不做深度威胁猎捕和安全事件响应。",
        en: "MDR (Managed Detection and Response) provides 24/7 continuous threat hunting, proactive monitoring, and active remediation response."
      },
      mnemonic: "口诀：日常 IT 找 MSP；主动防威胁、做响应找 MDR。"
    },
    {
      id: 9, type: "single",
      stem: {
        zh: "在现代 Windows 系统中，微软用来替代旧版 Windows XP/2000 中基于文本命令行的“故障恢复控制台（Recovery Console）”的高级恢复环境是：",
        en: "Which graphical diagnostic and troubleshooting environment replaced the legacy Recovery Console found in Windows XP/2000?"
      },
      options: [
        { key: "A", text: "System Restore" },
        { key: "B", text: "WinRE (Windows Recovery Environment)" },
        { key: "C", text: "Safe Mode with Command Prompt" },
        { key: "D", text: "Device Manager Recovery" }
      ],

  let customQuestions = JSON.parse(localStorage.getItem('a_plus_custom_questions') || '[]');
  let questions = [...baseQuestions, ...customQuestions];

  let currentIdx = 0;
  let userSelections = {}; 
  let submittedStatus = {};
  let starredSet = new Set(JSON.parse(localStorage.getItem('a_plus_stars') || '[]'));

  function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('a_plus_lang', currentLang);
    renderUI();
  }

  function initNavGrid() {
    const grid = document.getElementById('navGrid');
    grid.innerHTML = '';
    questions.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = `nav-btn ${i === currentIdx ? 'current' : ''}`;
      btn.id = `nav-${i}`;
      btn.innerText = i + 1;
      btn.onclick = () => jumpTo(i);
      grid.appendChild(btn);
    });
  }

  function updateStats() {
    let answered = Object.keys(submittedStatus).length;
    let correctCount = 0;
    Object.keys(submittedStatus).forEach(idx => {
      const q = questions[idx];
      const sel = userSelections[idx] || [];
      if (isEqual(sel, q.answer)) correctCount++;
    });
    const acc = answered === 0 ? 0 : Math.round((correctCount / answered) * 100);
    const text = i18n[currentLang].statAnswered
      .replace('{ans}', answered)
      .replace('{total}', questions.length)
      .replace('{cor}', correctCount)
      .replace('{acc}', acc);
    document.getElementById('statsSummary').innerText = text;
  }

  function renderUI() {
    const t = i18n[currentLang];
    document.getElementById('appTitle').innerText = t.appTitle;
    document.getElementById('appSubtitle').innerText = t.appSubtitle;
    document.getElementById('langToggleBtn').innerText = t.langBtn;
    document.getElementById('addBtnLabel').innerText = t.addBtn;
    document.getElementById('prevBtn').innerText = t.prev;
    document.getElementById('nextBtn').innerText = t.next;
    document.getElementById('correctLabelPrefix').innerText = t.correctAns;
    renderQuiz();
  }

  function renderQuiz() {
    const q = questions[currentIdx];
    const t = i18n[currentLang];

    document.getElementById('qIndexLabel').innerText = t.qOf
      .replace('{curr}', currentIdx + 1)
      .replace('{total}', questions.length);

    if (q.type === 'multiple') {
      const count = q.selectLimit || q.answer.length;
      document.getElementById('qTag').innerText = t.multi.replace('{n}', count);
      document.getElementById('qTag').className = 'q-tag multi';
    } else {
      document.getElementById('qTag').innerText = t.single;
      document.getElementById('qTag').className = 'q-tag';
    }

    // 动态提取语言题干
    const stemText = (typeof q.stem === 'object') ? (q.stem[currentLang] || q.stem.zh || q.stem.en) : q.stem;
    document.getElementById('qTitle').innerText = stemText;

    const starBtn = document.getElementById('starBtn');
    starBtn.className = `star-btn ${starredSet.has(q.id) ? 'starred' : ''}`;

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    const isSubmitted = submittedStatus[currentIdx];
    const currentSelected = userSelections[currentIdx] || [];

    q.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = `option-item ${isSubmitted ? 'disabled' : ''}`;

      const input = document.createElement('input');
      input.type = q.type === 'multiple' ? 'checkbox' : 'radio';
      input.name = `opt_${q.id}`;
      input.value = opt.key;
      input.checked = currentSelected.includes(opt.key);
      input.disabled = isSubmitted;

      input.onchange = () => {
        if (q.type === 'multiple') {
          const checked = Array.from(container.querySelectorAll('input:checked')).map(el => el.value);
          userSelections[currentIdx] = checked;
        } else {
          userSelections[currentIdx] = [opt.key];
        }
      };

      if (isSubmitted) {
        if (q.answer.includes(opt.key)) {
          label.classList.add('correct-ans');
        } else if (currentSelected.includes(opt.key)) {
          label.classList.add('user-wrong');
        }
      }

      label.appendChild(input);
      const span = document.createElement('span');
      const optText = (typeof opt.text === 'object') ? (opt.text[currentLang] || opt.text.zh || opt.text.en) : opt.text;
      span.innerText = `${opt.key}. ${optText.replace(/^[A-E]\.\s*/i, '')}`;
      label.appendChild(span);
      container.appendChild(label);
    });

    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').disabled = currentIdx === questions.length - 1;

    const submitBtn = document.getElementById('submitBtn');
    const feedbackBox = document.getElementById('feedbackBox');
    const fbTitle = document.getElementById('fbTitle');

    if (isSubmitted) {
      submitBtn.disabled = true;
      submitBtn.innerText = t.submitted;

      const isCorrect = isEqual(currentSelected, q.answer);
      feedbackBox.className = `feedback-box ${isCorrect ? 'correct' : 'wrong'}`;
      fbTitle.className = `fb-title ${isCorrect ? 'correct' : 'wrong'}`;
      fbTitle.innerText = isCorrect ? t.correctTitle : t.wrongTitle;
      document.getElementById('correctKey').innerText = q.answer.join(', ');

      const expText = (typeof q.explanation === 'object') ? (q.explanation[currentLang] || q.explanation.zh || q.explanation.en) : q.explanation;
      document.getElementById('expContent').innerText = expText;

      const mnemonicEl = document.getElementById('mnemonicBox');
      if (q.mnemonic) {
        mnemonicEl.innerText = `${t.tipPrefix} ${q.mnemonic}`;
        mnemonicEl.style.display = 'block';
      } else {
        mnemonicEl.style.display = 'none';
      }

      feedbackBox.style.display = 'block';
    } else {
      submitBtn.disabled = false;
      submitBtn.innerText = t.submit;
      feedbackBox.style.display = 'none';
    }

    document.querySelectorAll('.nav-btn').forEach((btn, i) => {
      btn.classList.remove('current');
      if (i === currentIdx) btn.classList.add('current');
    });

    updateStats();
  }

  function isEqual(arr1, arr2) {
    if (!arr1 || !arr2 || arr1.length !== arr2.length) return false;
    return [...arr1].sort().join('') === [...arr2].sort().join('');
  }

  function handleCommit() {
    const q = questions[currentIdx];
    const selected = userSelections[currentIdx];
    if (!selected || selected.length === 0) {
      alert(i18n[currentLang].alertSelect);
      return;
    }

    submittedStatus[currentIdx] = true;
    const isCorrect = isEqual(selected, q.answer);
    const navBtn = document.getElementById(`nav-${currentIdx}`);
    if (navBtn) {
      navBtn.classList.add(isCorrect ? 'correct' : 'wrong');
    }

    renderQuiz();
  }

  function navigate(delta) {
    const target = currentIdx + delta;
    if (target >= 0 && target < questions.length) {
      currentIdx = target;
      renderQuiz();
    }
  }

  function jumpTo(idx) {
    currentIdx = idx;
    renderQuiz();
  }

  function toggleCurrentStar() {
    const q = questions[currentIdx];
    if (starredSet.has(q.id)) {
      starredSet.delete(q.id);
    } else {
      starredSet.add(q.id);
    }
    localStorage.setItem('a_plus_stars', JSON.stringify([...starredSet]));
    renderQuiz();
  }

  function openAddModal() {
    document.getElementById('addModal').style.display = 'flex';
  }
  function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
  }

  function saveNewQuestion() {
    const stem = document.getElementById('newStem').value.trim();
    const type = document.getElementById('newType').value;
    const optText = document.getElementById('newOptions').value.trim();
    const ansText = document.getElementById('newAnswer').value.trim().toUpperCase();
    const exp = document.getElementById('newExp').value.trim();
    const mnemonic = document.getElementById('newMnemonic').value.trim();

    if (!stem || !optText || !ansText) {
      alert('请完整填写题干、选项和正确答案！');
      return;
    }

    const lines = optText.split('\n').filter(l => l.trim().length > 0);
    const options = lines.map((l, i) => {
      const match = l.match(/^([A-Ea-e])[\.\:\、\s]/);
      const key = match ? match[1].toUpperCase() : String.fromCharCode(65 + i);
      return { key, text: l.trim() };
    });

    const ansArray = ansText.replace(/[^A-E]/g, '').split('');

    const newQ = {
      id: Date.now(),
      type,
      stem: { zh: stem, en: stem },
      options,
      answer: ansArray,
      explanation: { zh: exp || '无详细解析', en: exp || 'No detailed explanation' },
      mnemonic: mnemonic
    };

    customQuestions.push(newQ);
    localStorage.setItem('a_plus_custom_questions', JSON.stringify(customQuestions));
    questions = [...baseQuestions, ...customQuestions];

    closeAddModal();
    initNavGrid();
    jumpTo(questions.length - 1);
    alert('新题目添加成功！');
  }

  initNavGrid();
  renderUI();
</script>
